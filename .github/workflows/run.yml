name: Gold Monitor Workflow

on:
  schedule:
    - cron: '0 */6 * * *'   # هر ۶ ساعت یک‌بار خودکار اجرا میشه
  workflow_dispatch:          # دکمه اجرای دستی توی تب Actions

jobs:
  run-gold-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Gold Monitor Script
        run: python main.py
